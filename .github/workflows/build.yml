name: Build e pubblicazione

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Gioco desktop (jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila il jar
        run: |
          chmod +x gradlew
          ./gradlew dist --stacktrace
      - name: Prepara pacchetto
        run: |
          mkdir -p pacchetto/SandsOfTime
          cp build/libs/SandsOfTime.jar pacchetto/SandsOfTime/
          cp -r assets pacchetto/SandsOfTime/
          printf 'Avvio: doppio clic su SandsOfTime.jar oppure "java -jar SandsOfTime.jar" da questa cartella.\nServe Java 11 o superiore.\n' > pacchetto/SandsOfTime/LEGGIMI.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SandsOfTime-desktop
          path: pacchetto

  web:
    name: Gioco web (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila in JavaScript con TeaVM
        run: |
          chmod +x gradlew
          ./gradlew :web:gdx_teavm_web_js_build --stacktrace
      - name: Contenuto generato
        run: ls -la web/build/dist/js/webapp && du -sh web/build/dist/js/webapp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/js/webapp
      - name: Pubblica sul ramo "web" (per Render Static Site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: web/build/dist/js/webapp
          force_orphan: true

  pages:
    name: Pubblica su GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
